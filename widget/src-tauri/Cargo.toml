[package]
name = "relay-widget"
version = "0.1.0"
edition = "2021"
description = "Relay's mascot, floating outside the terminal"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pinned to the versions tauri already resolves, so we share one objc2 rather
# than linking two. See float_above_fullscreen in main.rs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSResponder"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
